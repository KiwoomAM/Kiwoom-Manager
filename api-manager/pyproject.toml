[project]
name = "kiwoom-api-handler-sdk"
version = "1.0.0"
description = "Kiwoom API Handler SDK - HTTP 클라이언트"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api_handler_sdk*"]
