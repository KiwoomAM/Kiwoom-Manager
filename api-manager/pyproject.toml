[project]
name = "kiwoom-api-manager"
version = "1.0.0"
description = "Kiwoom API Manager - API Handler HTTP 클라이언트"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api_manager*"]
