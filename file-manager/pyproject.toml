[project]
name = "File-Manager"
version = "0.1.0"
description = "File Manager - uv workspace root (시연용 stub)"
requires-python = ">=3.11"
dependencies = [
    "kiwoom-file-manager[dev]",
    "kiwoom-file-manager-service[dev]",
]

[tool.uv.workspace]
members = ["sdk", "service"]

[tool.uv.sources]
kiwoom-file-manager = { workspace = true }
kiwoom-file-manager-service = { workspace = true }
kiwoom-mdb-handler = { path = "../mdb-handler/sdk", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []
