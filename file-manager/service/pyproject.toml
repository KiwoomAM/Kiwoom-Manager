[project]
name = "kiwoom-file-manager-service"
version = "1.0.0"
description = "Kiwoom File Manager Service - 파일 저장, 캐시 조회, 파일 반환 서비스"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
