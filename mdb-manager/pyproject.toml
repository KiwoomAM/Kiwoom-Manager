[project]
name = "kiwoom-mdb-manager"
version = "2.0.0"
description = "Kiwoom MongoDB Handler SDK - HTTP 클라이언트"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mdb_manager*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
