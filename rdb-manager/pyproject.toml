[project]
name = "kiwoom-rdb-manager"
version = "1.0.0"
description = "Kiwoom 프로젝트 PostgreSQL 매니저 (공개 클라이언트)"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.1.0",
    "pandas>=2.0.0",
    "kiwoom-rdb-handler>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rdb_manager*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
