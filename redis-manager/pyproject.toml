[project]
name = "kiwoom-redis-manager"
version = "3.0.0"
description = "Kiwoom 프로젝트 Redis 매니저 (redis-handler HTTP 경유 + 메모리 폴백 + SET 옵션)"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.23.0",
]
langgraph = [
    "langgraph-checkpoint-redis==0.5.0",
    "langgraph>=1.2.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["redis_manager*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
