[project]
name = "kiwoom-redis-manager"
version = "2.0.0"
description = "Kiwoom 프로젝트 Redis 핸들러 (메모리 폴백 + 재시도 + SET 옵션)"
requires-python = ">=3.10"
dependencies = [
    "redis>=5.0.0,<8",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.12.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["redis_manager*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
