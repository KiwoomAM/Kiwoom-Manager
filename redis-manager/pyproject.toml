[project]
name = "kiwoom-redis-handler"
version = "1.0.0"
description = "Kiwoom 프로젝트 Redis 핸들러"
requires-python = ">=3.10"
dependencies = [
    "redis>=5.0.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["redis_handler*"]
