[project]
name = "LLM-Request"
version = "0.2.0"
description = "LLM Request - uv workspace root"
readme = "README_v2.md"
requires-python = ">=3.11"
dependencies = [
    "kiwoom-llm-request[dev]",
    "kiwoom-llm-request-service[dev]",
]

[tool.uv.workspace]
members = ["sdk", "service"]

[tool.uv.sources]
kiwoom-llm-request = { workspace = true }
kiwoom-llm-request-service = { workspace = true }
kiwoom-llm-handler = { path = "../llm-handler/sdk", editable = true }
kiwoom-mdb-handler = { path = "../mdb-handler/sdk", editable = true }
kiwoom-redis-handler = { path = "../redis-handler", editable = true }
kiwoom-file-manager = { path = "../file-manager/sdk", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []
