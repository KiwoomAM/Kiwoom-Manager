[project]
name = "kiwoom-winus-manager"
version = "1.1.0"
description = "Kiwoom 프로젝트 WINUS Oracle DB 매니저 (클라이언트 SDK)"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["winus_manager*"]
