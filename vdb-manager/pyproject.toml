[project]
name = "kiwoom-embedder-handler"
version = "2.0.0"
description = "Kiwoom Embedder Handler SDK - HTTP 클라이언트"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["embedder_handler*"]
